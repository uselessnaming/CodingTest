# 저장 위치: .github/workflows/review-discuss.yml
# "[리뷰]"로 시작하는 이슈에 @claude를 넣어 댓글을 남기면, Claude가 리뷰한 코드와 지금까지의 대화를 읽고 답글을 답니다.
# 레포 주인이 쓴 댓글에만 반응합니다. 답글 형식은 CLAUDE.md의 "리뷰 이슈 대화 가이드"를 따릅니다.

name: Claude Review Discussion

on:
  issue_comment:
    types: [created]

jobs:
  reply:
    # 이슈(PR 제외) + 제목이 [리뷰]로 시작 + 레포 주인 + @claude 호출일 때만 실행
    # (Claude의 답글은 GitHub 로봇 계정으로 달려서 이 워크플로를 다시 실행시키지 않음)
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[리뷰]') &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # 답글·리액션 작성

    steps:
      # 댓글을 확인했다는 표시로 👀 리액션 (답글이 오기까지 1~3분 걸리므로)
      - name: React to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes > /dev/null || true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 리뷰 당시 커밋의 코드를 git show로 볼 수 있도록 전체 히스토리

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude reply
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          mkdir -p .claude-review
          cat > .claude-review/prompt.txt <<EOF
          이 저장소는 코딩 테스트 풀이 저장소입니다. 리뷰 이슈 #$ISSUE_NUMBER 에 사용자가 의견을 댓글로 남겼습니다.
          저장소 루트 CLAUDE.md의 "리뷰 이슈 대화 가이드"에 따라 답글을 작성하세요.

          진행 순서:
          1. gh issue view $ISSUE_NUMBER --comments 로 이슈 본문(Claude의 첫 리뷰)과 댓글 전체를 시간순으로 읽습니다.
             작성자가 github-actions인 글은 Claude가 앞서 남긴 리뷰와 답글입니다. 대화 흐름 전체를 파악하세요.
          2. 답해야 할 댓글은 가장 최근에 사용자가 남긴 댓글(id $COMMENT_ID)입니다.
          3. 이슈 본문 끝의 review-meta 주석에서 커밋 SHA와 파일 경로를 찾고, git show 커밋SHA:"파일 경로" 로 리뷰 당시의 코드를 봅니다.
             파일이 그 뒤로 바뀌었는지 궁금하면 Read로 현재 버전도 확인할 수 있습니다. 같은 폴더의 README.md가 있으면 문제 설명으로 참고합니다.
          4. 필요하면 근거를 직접 검증합니다. Python 스크립트를 Write로 .claude-review/ 아래에 만들고 python3로 실행해 반례나 실행 시간을 확인할 수 있습니다.
          5. 참고 자료가 필요하면 WebSearch, WebFetch로 직접 확인한 자료만 링크합니다.
          6. 답글을 Write로 .claude-review/reply.md 에 저장한 뒤 gh issue comment $ISSUE_NUMBER --body-file .claude-review/reply.md 로 게시합니다.

          코드를 수정하거나 커밋·push하지 마세요. 답글 하나를 게시하면 종료합니다.
          EOF
          claude -p "$(cat .claude-review/prompt.txt)" \
            --max-turns 40 \
            --allowedTools "Read,Glob,Grep,Write,WebSearch,WebFetch,Bash(git show:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh api:*),Bash(python3:*)"
